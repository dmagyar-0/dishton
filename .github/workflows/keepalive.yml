name: Supabase keepalive

# Free-tier Supabase projects pause after ~7 days without database activity,
# which takes login down in production. One cheap anon-callable query every
# three days keeps the project awake. The job fails if the project doesn't
# answer, so a pause or outage shows up as a red run.
#
# Note: GitHub disables scheduled workflows after 60 days with no commits to
# the repo. Re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # peek_follow_code is read-only, granted to anon, and returns null for
      # an unknown code, so this touches Postgres without reading or writing
      # any user data.
      - name: Query the production database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/peek_follow_code" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Profile: app" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"keepalive"}'
