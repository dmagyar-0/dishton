name: Sync recipe agent

# Manual trigger for scripts/managed-agents/update.ts — the same sync the
# deploy workflow runs after every production deploy. Run it from the Actions
# tab (also in the GitHub mobile app) to re-apply the checked-in agent config
# without a deploy, e.g. after adding the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with: { deno-version: v1.46.3 }
      - name: Sync recipe agent
        run: deno run -A scripts/managed-agents/update.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
